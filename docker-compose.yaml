services:
  grafana:
    image: grafana/grafana:11.0.0
    container_name: ml-rag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml:ro
      - ./grafana/provisioning/dashboards/rag_dashboard.json:/etc/grafana/provisioning/dashboards/rag_dashboard.json:ro
    networks:
      - rag_network

  app:
    build: .
    container_name: ml-rag-app
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - PINECONE_API_KEY=${PINECONE_API_KEY:?Set PINECONE_API_KEY in your .env file}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL to your Supabase connection string}
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

networks:
  rag_network:

volumes:
  grafana_data:
